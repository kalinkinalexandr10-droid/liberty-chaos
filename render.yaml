# Описание сайта для Render (бесплатный тариф). Render сам находит этот файл в репозитории.
services:
  - type: web
    name: liberty-chaos
    runtime: node
    plan: free
    rootDir: site
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/mods
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false   # пароль админки вводится вручную в панели Render, в репозиторий не попадает
